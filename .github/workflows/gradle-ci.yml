name: Java CI with Gradle

on:
  push:
    branches:
      - "main"
      - "release"
      - "develop"
      - "hotfix"
      - "feature/**"
  pull_request:
    branches:
      - "main"
      - "release"
      - "develop"
      - "hotfix"
      - "feature/**"

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        java-package: jdk
        architecture: x64
        cache: maven

    - name: Build with Maven
      run: mvn -B clean test package --file pom.xml